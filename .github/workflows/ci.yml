name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17 # the major version Supabase runs
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11" # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        # API runtime + test tools; the notebook ML stack (requirements-worker.txt)
        # isn't needed by the app's tests.
        run: pip install -r requirements-dev.txt

      - name: Apply migrations to a fresh SQLite database
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci.sqlite3
        run: alembic upgrade head

      - name: Apply migrations to Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: alembic upgrade head

      - name: Run tests (SQLite)
        run: pytest -q

      - name: Run tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q

  frontend:
    name: Frontend type check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20" # matches frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

  frontend-smoke:
    name: Frontend smoke test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11" # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "20" # matches frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r ../backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the frontend, migrates and seeds a fresh SQLite database, starts
      # both servers, and loads the instructor course page and the student
      # review page (see frontend/playwright.config.ts).
      - name: Run smoke test
        env:
          PYTHON: python
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
