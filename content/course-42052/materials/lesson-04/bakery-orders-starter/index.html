<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>סיכום הזמנות למאפייה</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fbf8f2; color: #222; line-height: 1.5; }
    main { max-width: 640px; margin: 0 auto; }
    ul { list-style: none; padding: 0; }
    .order { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .order.ready { border-color: #2e7d32; background: #f1f8f1; }
    .order p { margin: 0 0 6px; }
    .details { color: #555; font-size: 14px; }
    .warning { color: #9a4b00; font-weight: 600; }
    button { min-height: 44px; padding: 8px 16px; font-size: 16px; border-radius: 6px; border: 1px solid #555; background: #fff; cursor: pointer; }
    button:disabled { cursor: default; color: #2e7d32; border-color: #2e7d32; }
    .summary { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>סיכום הזמנות למאפייה</h1>
    <p>ההזמנות למחר, מתוך שלוש הודעות לדוגמה (לא לקוחות אמיתיים).</p>
    <ul id="orders"></ul>
    <section class="summary" aria-labelledby="summary-title">
      <h2 id="summary-title">סך הכול</h2>
      <p id="totals"></p>
      <p id="missing"></p>
    </section>
    <p id="status" role="status"></p>
  </main>
  <script src="data.js"></script>
  <script src="orders.js"></script>
  <script src="app.js"></script>
</body>
</html>
