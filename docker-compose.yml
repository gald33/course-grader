services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app"
    env_file:
      - .env
    environment:
      APP_ENV: docker
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Local SQLite unless .env sets DATABASE_URL (e.g. the Supabase session pooler).
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/db.sqlite3}
      DATA_DIR: /data
      FRONTEND_ORIGIN: http://localhost:3000
      GOOGLE_CLIENT_SECRET_PATH: /data/secrets/google_client.json
      GOOGLE_TOKEN_PATH: /data/secrets/google_token.json
      NOTEBOOK_TOTAL_TIMEOUT_SECONDS: 900
      NOTEBOOK_PENALTY_POWER: 1.5
    volumes:
      - ./data:/data
      - ./backend:/app
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Polls the jobs table; runs on the instructor's machine even when the
    # API is hosted, as long as both use the same DATABASE_URL.
    command: python -m app.tasks.worker
    env_file:
      - .env
    environment:
      APP_ENV: docker
      # Local SQLite unless .env sets DATABASE_URL (e.g. the Supabase session pooler).
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/db.sqlite3}
      DATA_DIR: /data
      GOOGLE_CLIENT_SECRET_PATH: /data/secrets/google_client.json
      GOOGLE_TOKEN_PATH: /data/secrets/google_token.json
      NOTEBOOK_TOTAL_TIMEOUT_SECONDS: 900
      NOTEBOOK_PENALTY_POWER: 1.5
    volumes:
      - ./data:/data
      - ./backend:/app
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      # Server-side proxy target for /api/* (used by the student review page).
      BACKEND_INTERNAL_URL: http://backend:8000
      # Force polling — Next.js's native fs watcher is unreliable inside
      # Docker on macOS (the bind-mounted volume doesn't deliver inotify events).
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      # Anonymous volumes shadow the bind mount so the host doesn't overwrite
      # the container's installed deps and dev build cache.
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
