<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560" font-family="'Frank Ruhl Libre', 'Noto Sans Hebrew', 'Arial Hebrew', Arial, sans-serif" direction="rtl">
  <title>מבנה של מודל transformer: מטקסט לטוקן הבא</title>
  <rect width="360" height="560" fill="#fdfbf6"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L5 9 L10 0" fill="none" stroke="#5b554b" stroke-width="1.6"/>
    </marker>
  </defs>
  <g font-size="16" fill="#2a2620" text-anchor="middle">
    <rect x="60" y="16" width="240" height="48" rx="10" fill="#efe9dc" stroke="#e3dccd"/>
    <text x="180" y="38">טקסט</text>
    <text x="180" y="56" font-size="12" fill="#5b554b">«מיכל רוצה שלוש עוגיות למחר»</text>
    <line x1="180" y1="66" x2="180" y2="90" stroke="#5b554b" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="60" y="94" width="240" height="48" rx="10" fill="#f5d9c8" stroke="#c97852"/>
    <text x="180" y="116">1. טוקנים</text>
    <text x="180" y="134" font-size="12" fill="#5b554b">ה-tokenizer חותך לחתיכות (שלב A)</text>
    <line x1="180" y1="144" x2="180" y2="168" stroke="#5b554b" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="60" y="172" width="240" height="48" rx="10" fill="#d4e0e6" stroke="#4a6c7a"/>
    <text x="180" y="194">2. ייצוגים (embeddings)</text>
    <text x="180" y="212" font-size="12" fill="#5b554b">לכל טוקן – רשימת מספרים (שלב C)</text>
    <line x1="180" y1="222" x2="180" y2="250" stroke="#5b554b" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="30" y="254" width="300" height="176" rx="14" fill="none" stroke="#2d5d4f" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="180" y="276" font-size="13" fill="#2d5d4f">3. שכבות – הרבה בזו אחר זו (בדרך כלל עשרות)</text>
    <rect x="60" y="288" width="240" height="48" rx="10" fill="#cee3da" stroke="#2d5d4f"/>
    <text x="180" y="310">קשב (attention)</text>
    <text x="180" y="328" font-size="12" fill="#5b554b">כל טוקן נשען על הטוקנים שלפניו</text>
    <line x1="180" y1="338" x2="180" y2="360" stroke="#5b554b" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="60" y="364" width="240" height="48" rx="10" fill="#cee3da" stroke="#2d5d4f"/>
    <text x="180" y="386">רשת נוירונים קטנה</text>
    <text x="180" y="404" font-size="12" fill="#5b554b">מעבדת כל ייצוג (שלבים A–B)</text>

    <line x1="180" y1="432" x2="180" y2="460" stroke="#5b554b" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="60" y="464" width="240" height="56" rx="10" fill="#f3dfc4" stroke="#b8722f"/>
    <text x="180" y="488">4. הסתברויות לטוקן הבא</text>
    <text x="180" y="508" font-size="12" fill="#5b554b">בוחרים טוקן, מצרפים, וחוזרים להתחלה</text>
    <text x="180" y="546" font-size="11" fill="#8a8378">איור מפושט להסבר. מודל אמיתי כולל פרטים נוספים.</text>
  </g>
</svg>
